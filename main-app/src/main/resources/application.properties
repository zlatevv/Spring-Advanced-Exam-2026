spring.application.name=main-app

server.port=8080

logging.level.io.github.cdimascio=DEBUG
logging.level.me.paulschwarz=DEBUG

spring.datasource.url=jdbc:mysql://localhost:3306/raremanuscripts_db?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379

digitization.service.url=${DIGITIZATION_SERVICE_URL}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

app.frontend.url=${FRONTEND_URL}

email.service.url=${EMAIL_SERVICE_URL}